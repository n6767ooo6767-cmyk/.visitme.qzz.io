name: Automatic subdomain registration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  provision:
    if: contains(github.event.issue.labels.*.name, 'subdomain')
    runs-on: ubuntu-latest
    env:
      DNS_API_TOKEN: ${{ secrets.DNS_API_TOKEN }}
      DNS_ZONE_NAME: visitme.qzz.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate, register and provision DNS
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from urllib.parse import quote, urlparse
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          body = os.environ.get("ISSUE_BODY", "")
          issue = os.environ["ISSUE_NUMBER"]
          repo = os.environ["REPO"]
          dns_token = os.environ.get("DNS_API_TOKEN", "").strip()
          zone_name = os.environ["DNS_ZONE_NAME"].strip().lower().rstrip(".")

          def gh_comment(message):
              subprocess.run(["gh", "issue", "comment", issue, "--repo", repo, "--body", message], check=True)

          def close_issue():
              subprocess.run(["gh", "issue", "close", issue, "--repo", repo], check=True)

          def field(label):
              pattern = rf"### {re.escape(label)}\s*\n\s*(.*?)(?=\n### |\Z)"
              m = re.search(pattern, body, re.S | re.I)
              return m.group(1).strip() if m else ""

          subdomain = field("Subdomain").lower().strip()
          target = field("GitHub Pages URL").strip().strip('`')
          target = target if re.match(r"^https?://", target, re.I) else "https://" + target

          valid_name = bool(re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", subdomain))
          reserved = {
              "admin", "root", "api", "mail", "ftp", "www", "support",
              "github", "google", "apple", "microsoft", "discord", "telegram",
              "bank", "paypal", "login", "signin", "security"
          }
          parsed = urlparse(target)
          host = (parsed.hostname or "").lower().rstrip(".")
          valid_target = (
              parsed.scheme == "https"
              and parsed.username is None
              and parsed.password is None
              and parsed.port is None
              and (host == "github.io" or host.endswith(".github.io"))
          )

          if not valid_name or subdomain in reserved or not valid_target:
              gh_comment(
                  "❌ **Заявка отклонена автоматически.**\n\n"
                  "Нужно указать корректное имя поддомена и HTTPS-адрес GitHub Pages "
                  "(`*.github.io`). Файлы репозитория и DNS не изменены."
              )
              close_issue()
              raise SystemExit(0)

          if not dns_token:
              gh_comment(
                  "❌ **DNS-настройка не выполнена.**\n\n"
                  "Секрет `DNS_API_TOKEN` не найден. Запись репозитория не создавалась, "
                  "чтобы поддомен не оказался зарегистрированным без DNS."
              )
              close_issue()
              raise SystemExit(0)

          out = Path("domains") / f"{subdomain}.json"
          if out.exists():
              gh_comment(f"❌ **`{subdomain}.{zone_name}` уже занят.**\n\nВыбери другое имя и создай новую заявку.")
              close_issue()
              raise SystemExit(0)

          api = "https://desec.io/api/v1"
          headers = {
              "Authorization": f"Token {dns_token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          def api_request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(url, data=data, headers=headers, method=method)
              try:
                  with urlopen(req, timeout=20) as response:
                      raw = response.read().decode()
                      return json.loads(raw) if raw else {}
              except HTTPError as e:
                  detail = e.read().decode(errors="replace")[:500]
                  raise RuntimeError(f"deSEC API HTTP {e.code}: {detail}")
              except URLError as e:
                  raise RuntimeError(f"deSEC API connection error: {e.reason}")

          try:
              zone_url = f"{api}/domains/{quote(zone_name, safe='')}/"
              zone = api_request("GET", zone_url)
              if zone.get("name", "").lower().rstrip(".") != zone_name:
                  raise RuntimeError(f"deSEC zone `{zone_name}` was not found or is not owned by this token.")

              fqdn = f"{subdomain}.{zone_name}"
              rrset_url = f"{api}/domains/{quote(zone_name, safe='')}/rrsets/{quote(subdomain, safe='')}/CNAME/"

              try:
                  existing = api_request("GET", rrset_url)
                  if existing.get("records"):
                      raise RuntimeError(f"DNS CNAME `{fqdn}` already exists.")
              except RuntimeError as exc:
                  if "HTTP 404" not in str(exc):
                      raise

              created = api_request(
                  "POST",
                  f"{api}/domains/{quote(zone_name, safe='')}/rrsets/",
                  {
                      "subname": subdomain,
                      "type": "CNAME",
                      "ttl": 3600,
                      "records": [host + "."],
                  },
              )
              if not created.get("name"):
                  raise RuntimeError("deSEC did not confirm the CNAME creation.")
          except Exception as exc:
              gh_comment(
                  "❌ **DNS-регистрация не выполнена.**\n\n"
                  f"Причина: `{str(exc)[:400]}`\n\n"
                  "Запись репозитория не создавалась, чтобы не получить частично настроенный поддомен."
              )
              close_issue()
              raise SystemExit(0)

          out.parent.mkdir(parents=True, exist_ok=True)
          record = {
              "name_for_URL": f"{subdomain}.{zone_name}",
              "target": host,
              "type": "CNAME"
          }
          out.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", str(out)], check=True)
          subprocess.run(["git", "commit", "-m", f"Register {subdomain}.{zone_name}"], check=True)
          subprocess.run(["git", "push"], check=True)

          url = f"https://{subdomain}.{zone_name}"
          msg = (
              "🎉 **Готово — поддомен зарегистрирован автоматически!**\n\n"
              f"🌐 **Адрес:** [{url}]({url})\n\n"
              f"🎯 **Target:** `{host}`\n\n"
              "Заявка проверена, DNS CNAME создан через deSEC API, запись добавлена в репозиторий "
              "и изменения автоматически отправлены в `main`."
          )
          gh_comment(msg)
          close_issue()
          PY
